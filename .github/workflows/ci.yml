name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, pytest incl. real tiny-model LoRA training on MLX CPU)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.13.1" }
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q

  frontend:
    name: Frontend (lint, build, types, unit, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: npm audit (production dependencies, high+)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    # MLX's CPU backend is far too slow for the 4-bit 0.5B base model (4 steps did not finish in
    # 10 minutes), so CI runs the same real jobs on a tiny random model with the base tokenizer.
    # The pinned-model journey runs locally on Metal; see docs/TESTING.md.
    name: Playwright E2E (real jobs on a tiny random model, MLX CPU)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.13.1" }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: uv sync --frozen
        working-directory: backend
      - name: Build tiny random model (base tokenizer)
        working-directory: backend
        run: uv run python scripts/make_tiny_model.py "$RUNNER_TEMP/tiny-model"
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          TUNELAB_BASE_MODEL: ${{ runner.temp }}/tiny-model
          TUNELAB_BASE_REVISION: ""
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: frontend/playwright-report, retention-days: 7 }

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
