[project]
name = "tunelab"
version = "0.1.0"
description = "TuneLab API: genuine LoRA fine-tuning, evaluation and comparison on Apple Silicon (MLX)."
authors = [
    { name = "Sreevarshann", email = "85571922+Sreevarshann@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.5",
    "mlx-lm>=0.32.2",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tunelab = "tunelab.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 200
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "RUF"]
ignore = ["B008"]  # FastAPI's File()/Query() defaults are the framework idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: real MLX training/inference on the pinned base model (Apple Silicon)"]
